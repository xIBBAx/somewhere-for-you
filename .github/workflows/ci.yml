name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only: this workflow never needs to write to the repository, and pull
# requests from forks never see secrets (there are none)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No personal files committed by mistake
        run: |
          if git ls-files --error-unmatch customize/gift.json >/dev/null 2>&1; then echo "customize/gift.json is committed"; exit 1; fi
          if [ -n "$(git ls-files customize/media | grep -v '^customize/media/README.md$')" ]; then echo "files in customize/media are committed"; exit 1; fi
